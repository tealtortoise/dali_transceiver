<!DOCTYPE html>
<html lang="en">
    <head>
        <title>%s</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <link rel="shortcut icon" href="favicon.ico">
        <link rel="apple-touch-icon image_src" href="apple-touch-icon.png">
        <link rel="manifest" href="site.webmanifest">
        <link rel="stylesheet" type="text/css" href="styles.css">
        <script type="text/javascript" src="index.js"></script>
    </head>
<body class="%s">
    <header>
        <h1>%s</h1>
        <nav>
            <a href="/"><button class="nav selected" level="254">Levels</button></a>
            <a href="/setup"><button class="nav " level="254">Setup</button></a>
            <a href="/ch"><button class="nav " level="254">Channels</button></a>
        </nav>
    </header>
    <main class="loading">
    <div id="override-warning" style="display:none">CHANNEL OVERRIDES ACTIVE!</div>
    <div id="offbutton-box">
        <button class="base levelbutton grey" id="buttonoff">All Power Off<span></span></button>
        <button class="base levelbutton grey slow" id="sbuttonoff">2 Min Delay</button>
    </div>
    <div id="onbutton-box">
        <button class="base levelbutton lightgrey" id="buttonon">Turn Power On...<span id="poweron-level">--</span></button>
        <button class="base levelbutton lightgrey slow" id="sbuttonon"> </button>
        <div id="offmessage">
        </div>
    </div>
    <div class="levelbox" id="levelbox">
        <button class="base levelbutton seven" level="254" id="preset6"><span class="num">6</span>%s<span class="percent">100%</span></button>
        <button class="base levelbutton seven slow" level="254" id="spreset6">Slow</button>
        <button class="base levelbutton six" level="240" id="preset5"><span class="num">5</span>%s<span class="percent"></span></button>
        <button class="base levelbutton six slow" level="240" id="spreset5">Slow</button>
        <button class="base levelbutton five" level="220" id="preset4"><span class="num">4</span>%s<span class="percent"></span></button>
        <button class="base levelbutton five slow" level="220" id="spreset4">Slow</button>
        <button class="base levelbutton four" level="180" id="preset3"><span class="num">3</span>%s<span class="percent"></span></button>
        <button class="base levelbutton four slow" level="180" id="spreset3">Slow</button>
        <button class="base levelbutton three" level="30" id="preset2"><span class="num">2</span>%s<span class="percent"></span></button>
        <button class="base levelbutton three slow" level="30" id="spreset2">Slow</button>
        <button class="base levelbutton two" level="10" id="preset1"><span class="num">1</span>%s<span class="percent"></span></button>
        <button class="base levelbutton two slow " level="10" id="spreset1">Slow</button>
        <button class="base levelbutton one" level="0" id="preset0"><span class="num">0</span>%s<span class="percent">0%</span></button>
        <button class="base levelbutton one slow" level="0" id="spreset0">Slow</button>
    </div>
    <div class="fadespeed-box">
        <h2 id="fadetitle">Slow fade speed <span id="currentfade">(<span id="currentfadeinner"></span>s)</span></h2>
        <button class="base fadebutton fastfade" speed="10" id="fastfade">10sec</button>
        <button class="base fadebutton medfade" speed="30" id="medfade">30s</button>
        <button class="base fadebutton slowfade" speed="180" id="slowfade">3min</button>
        <button class="base fadebutton vslowfade" speed="900" id="vslowfade">15min</button>
    </div>
    <div class="slidecontainer">
        <span id="ajaxlevel">--</span><input type="range" min="0" max="254" value="50" class="slider" id="levelslider">
        <button id="go">Go</button>
        <div class="info">
            Level <span id="currentbyte">--</span> -> <span id="spbyte">--</span> 
            (<span id="currentpercent">--</span> -> <span id="sppercent">--</span>)
        </div>
        <div class="info">
            LED Power <span id="currentpower">--</span> -> <span id="sppower">--</span>
        </div>
        
        <div class="mono"><span id="loghead"></span><br><span id="log"></span></div>
        
        <div id="debug"></div>
    </div> 
</main>
</body>
</html>
