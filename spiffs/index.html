<!DOCTYPE html>
<html lang="en">
    <head>
        <title>%s</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <link rel="shortcut icon" href="favicon.ico">
        <link rel="apple-touch-icon image_src" href="apple-touch-icon.png">
        <link rel="manifest" href="site.webmanifest">
        <link rel="stylesheet" type="text/css" href="styles.css">
        <script type="text/javascript" src="index.js"></script>
    </head>
<body>
              
    <header>
        <h1>%s</h1>
        <nav>
            <a href="/"><button class="nav selected" level="254">Levels</button></a>
            <a href="/setup"><button class="nav " level="254">Setup</button></a>
            <a href="/ch"><button class="nav " level="254">Channels</button></a>
        </nav>
    </header>
    <main class="loading">
    <div id="offbutton-box">
        <button class="base levelbutton grey" id="buttonoff">All Power Off<span></span></button>
        <button class="base levelbutton grey slow" id="sbuttonoff">2 Min Delay</button>
    </div>
    <div id="onbutton-box">
        <button class="base levelbutton lightgrey" id="buttonon">Turn Power On...<span id="poweron-level">--</span></button>
        <button class="base levelbutton lightgrey slow" id="sbuttonon"> </button>
        <div id="offmessage">
        </div>
    </div>
    <div class="levelbutton-box" id="levelbutton-box">
        <button class="base levelbutton magenta" level="254">%s<span>100%</span></button>
        <button class="base levelbutton magenta slow" level="254">Slow</button>
        <button class="base levelbutton purple" level="240" id="preset5">%s<span></span></button>
        <button class="base levelbutton purple slow" level="240" id="spreset5">Slow</button>
        <button class="base levelbutton teal" level="220" id="preset4">%s<span></span></button>
        <button class="base levelbutton teal slow" level="220" id="spreset4">Slow</button>
        <button class="base levelbutton green" level="180" id="preset3">%s<span></span></button>
        <button class="base levelbutton green slow" level="180" id="spreset3">Slow</button>
        <button class="base levelbutton yellow" level="30" id="preset2">%s<span></span></button>
        <button class="base levelbutton yellow slow" level="30" id="spreset2">Slow</button>
        <button class="base levelbutton orange" level="10" id="preset1">%s<span></span></button>
        <button class="base levelbutton orange slow " level="10" id="spreset1">Slow</button>
        <button class="base levelbutton red" level="0" id="preset0">%s<span>0%</span></button>
        <button class="base levelbutton red slow" level="0" id="spreset0">Slow</button>
    </div>
    <div class="fadespeed-box">
        <h2 id="fadetitle">Slow fade speed <span id="currentfade">(<span id="currentfadeinner"></span>s)</span></h2>
        <button class="base fadebutton fastfade" speed="10" id="fastfade">10sec</button>
        <button class="base fadebutton medfade" speed="30" id="medfade">30s</button>
        <button class="base fadebutton slowfade" speed="180" id="slowfade">3min</button>
        <button class="base fadebutton vslowfade" speed="900" id="vslowfade">15min</button>
    </div>
    <div class="slidecontainer">
        <span id="ajaxlevel">--</span><input type="range" min="0" max="254" value="50" class="slider" id="levelslider">
        <button id="go">Go</button>
        <div class="info">
            Setpoint <span id="spbyte">--</span>
        </div>
        <div class="info">
            Current Level <span id="currentbyte">--</span>
        </div>
        <div class="info">
            Current LED Power <span id="currentpower">--</span>
        </div>
        <div class="info">
            Setpoint LED Power <span id="sppower">--</span>
        </div>
        
        <div id="debug"></div>
        
    </div> 
</main>
</body>
</html>
